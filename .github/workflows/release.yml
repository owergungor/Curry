name: Release Curry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.0)'
        required: false
        type: string
      allow_unsigned:
        description: 'Allow test build without Apple signing / updater credentials (default false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate Release Tag and Version Match
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
      is_test_build: ${{ steps.check.outputs.is_test_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Tag Format and Version Matching
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=""
          IS_TEST="false"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_TEST="false"
            git checkout -q "$GITHUB_REF"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            if [ "${{ inputs.allow_unsigned }}" = "true" ]; then
              IS_TEST="true"
            fi
            if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
              if [ "$IS_TEST" = "true" ]; then
                echo "Notice: Test build mode enabled (allow_unsigned=true). Proceeding with current branch HEAD commit."
              else
                echo "Existing tag '$TAG' found in repository. Checking out tagged commit."
                git checkout -q "refs/tags/${TAG}"
              fi
            else
              if [ "$IS_TEST" != "true" ]; then
                echo "::error::Tag '$TAG' does not exist in repository git tags! Official release via workflow_dispatch requires an existing git tag."
                exit 1
              fi
              echo "Notice: Tag '$TAG' not found in git tags; proceeding with branch HEAD for test build."
            fi
          else
            echo "::error::Release tag could not be determined. Push a tag matching 'v*' or provide tag input for manual dispatch."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Invalid release tag format: '$TAG'. Must match 'vX.Y' (e.g. v2.0) or 'vX.Y.Z'."
            exit 1
          fi

          USER_VER="${TAG#v}"
          EXPECTED_TECH=""
          if [[ "$USER_VER" =~ ^[0-9]+\.[0-9]+$ ]]; then
            EXPECTED_TECH="${USER_VER}.0"
          elif [[ "$USER_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            EXPECTED_TECH="${USER_VER}"
          else
            echo "::error::Release tag version '$USER_VER' is invalid. Expected format 'X.Y' or 'X.Y.Z'."
            exit 1
          fi

          if [ ! -f "src-tauri/tauri.conf.json" ] || [ ! -f "package.json" ]; then
            echo "::error::Manifest files missing (src-tauri/tauri.conf.json or package.json not found)!"
            exit 1
          fi

          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG_VER=$(node -p "require('./package.json').version")

          if [ "$TAURI_VER" != "$PKG_VER" ]; then
            echo "::error::Version mismatch between manifests: tauri.conf.json ($TAURI_VER) != package.json ($PKG_VER)"
            exit 1
          fi

          if [ "$TAURI_VER" != "$EXPECTED_TECH" ]; then
            echo "::error::Tag version '$TAG' (expected technical SemVer: '$EXPECTED_TECH') does not match manifest version '$TAURI_VER'. Aborting release before building any binaries."
            exit 1
          fi

          COMMIT_SHA=$(git rev-parse HEAD)

          if [ "$IS_TEST" = "true" ]; then
            RELEASE_TAG="${TAG}-test.${GITHUB_RUN_NUMBER}"
            echo "Test build isolated release tag: $RELEASE_TAG"
          else
            RELEASE_TAG="${TAG}"
            if gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null | grep -q "false"; then
              echo "::error::Official release for tag '$RELEASE_TAG' is already published and immutable! Re-releasing over an existing published release is prohibited."
              exit 1
            fi
          fi

          echo "Valid release tag confirmed: $TAG"
          echo "Target GitHub release tag: $RELEASE_TAG"
          echo "Verified commit SHA: $COMMIT_SHA"
          echo "Manifest version verified: $TAURI_VER (expected: $EXPECTED_TECH)"
          echo "Test build mode: $IS_TEST"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "is_test_build=$IS_TEST" >> "$GITHUB_OUTPUT"

  release-mac:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14
    needs: [validate-tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check and Configure Updater Signing
        id: updater-check
        env:
          IS_TEST_BUILD: ${{ needs.validate-tag.outputs.is_test_build }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          HAS_VALID_KEY=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | grep -q "untrusted comment:"; then
            HAS_VALID_KEY=true
          fi
          if [ "$IS_TEST_BUILD" = "true" ]; then
            echo "Notice: Test build mode. Disabling updater artifacts and pubkey for unsigned test build."
            echo "SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          elif [ "$HAS_VALID_KEY" = "true" ]; then
            echo "Valid Tauri updater signing key detected. Enabling updater artifacts generation."
            echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Official release requires TAURI_SIGNING_PRIVATE_KEY secret for updater security! Official releases cannot be published without updater artifacts."
            exit 1
          fi

      - name: Verify Apple Developer Credentials
        env:
          IS_TEST_BUILD: ${{ needs.validate-tag.outputs.is_test_build }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$IS_TEST_BUILD" != "true" ]; then
            if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
              echo "::error::Official release requires Apple Developer ID signing certificate (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY). Building unsigned packages for official releases is prohibited."
              exit 1
            fi
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::error::Official release requires Apple notarization credentials (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID). Releasing un-notarized packages for official releases is prohibited."
              exit 1
            fi
            echo "Apple Developer signing and notarization credentials verified for official release."
          else
            echo "Notice: Test build mode enabled (allow_unsigned=true). Bypassing Apple signing/notarization requirement."
          fi

      - name: Setup macOS Keychain for Apple Developer Signing
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "Setting up temporary keychain for Apple Developer ID certificate..."
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Build Tauri macOS Apple Silicon App & DMG
        env:
          IS_TEST_BUILD: ${{ needs.validate-tag.outputs.is_test_build }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          trap 'rm -f tauri.build-override.json' EXIT
          if [ "$SIGNING_ENABLED" = "true" ]; then
            node -e "fs.writeFileSync('tauri.build-override.json', JSON.stringify({ bundle: { createUpdaterArtifacts: true } }));"
          elif [ "$IS_TEST_BUILD" = "true" ]; then
            node -e "fs.writeFileSync('tauri.build-override.json', JSON.stringify({ bundle: { createUpdaterArtifacts: false }, plugins: { updater: { pubkey: null } } }));"
          fi
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE
            unset APPLE_CERTIFICATE_PASSWORD
            unset APPLE_SIGNING_IDENTITY
            unset APPLE_ID
            unset APPLE_PASSWORD
            unset APPLE_TEAM_ID
          fi
          if [ "$SIGNING_ENABLED" != "true" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npx tauri build --target aarch64-apple-darwin -c tauri.build-override.json

      - name: Stage and Package macOS Artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist_release"
          TAG_NAME="${{ needs.validate-tag.outputs.tag }}"

          # Rename and package DMG
          if compgen -G "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg" > /dev/null; then
            cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "$GITHUB_WORKSPACE/dist_release/Curry_${TAG_NAME}_mac-arm64.dmg"
          fi
          # Verify architecture and package .app bundle into zip preserving symlinks (-y is critical for Gatekeeper)
          if [ -d "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Curry.app" ]; then
            cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
            file Curry.app/Contents/MacOS/*
            zip -r -y "$GITHUB_WORKSPACE/dist_release/Curry_${TAG_NAME}_mac-arm64.app.zip" Curry.app
            cd -
          fi
          # Stage updater artifacts if created (.tar.gz and .sig)
          if compgen -G "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz" > /dev/null; then
            cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz "$GITHUB_WORKSPACE/dist_release/"
            cp src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz.sig "$GITHUB_WORKSPACE/dist_release/" 2>/dev/null || true
          fi
          if [ -d "src-tauri/target/aarch64-apple-darwin/release/bundle/updater" ]; then
            cp -r src-tauri/target/aarch64-apple-darwin/release/bundle/updater/* "$GITHUB_WORKSPACE/dist_release/" 2>/dev/null || true
          fi

      - name: Sign DMG Container (if signing identity present)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            DMG_FILE=$(compgen -G "$GITHUB_WORKSPACE/dist_release/Curry_*_mac-arm64.dmg" | head -n 1)
            if [ -f "$DMG_FILE" ]; then
              echo "Explicitly signing DMG container with Apple Developer ID identity..."
              codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_FILE"
            fi
          fi

      - name: Verify Code Signing and Gatekeeper Assessment
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Curry.app"
          if [ -d "$APP_PATH" ]; then
            echo "=== Codesign Verification ==="
            codesign -dv --verbose=4 "$APP_PATH" || true
            echo "=== Deep Codesign Check ==="
            codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "Notice: Ad-hoc/unsigned build (no Apple Developer ID signature present)"
            echo "=== Gatekeeper spctl Assessment ==="
            spctl --assess --type execute --verbose=4 "$APP_PATH" || echo "Notice: Notarization ticket not stapled; this build is an unsigned test artifact not accepted by Gatekeeper by default"
          fi

      - name: Notarize and Staple DMG (if Apple credentials provided)
        env:
          IS_TEST_BUILD: ${{ needs.validate-tag.outputs.is_test_build }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            DMG_FILE=$(compgen -G "$GITHUB_WORKSPACE/dist_release/Curry_*_mac-arm64.dmg" | head -n 1)
            if [ -f "$DMG_FILE" ]; then
              echo "Submitting DMG for Apple notarization..."
              xcrun notarytool submit "$DMG_FILE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
              echo "Stapling notarization ticket to DMG..."
              xcrun stapler staple "$DMG_FILE"
              echo "Strict Gatekeeper assessment on notarized DMG..."
              spctl -a -t open --context context:primary-signature -v "$DMG_FILE"
            fi
            APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Curry.app"
            if [ -d "$APP_PATH" ]; then
              echo "Stapling notarization ticket to app bundle..."
              xcrun stapler staple "$APP_PATH"
              echo "Strict Gatekeeper assessment on notarized App bundle..."
              spctl --assess --type execute --verbose=4 "$APP_PATH"
            fi
          elif [ "$IS_TEST_BUILD" = "true" ]; then
            echo "Notice: Test build mode without Apple notarization credentials. Gatekeeper will reject this unsigned artifact until quarantined attribute is cleared manually."
          else
            echo "::error::Notarization failed: credentials missing in official release flow."
            exit 1
          fi

      - name: Upload macOS Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: dist_release/*

  release-windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: [validate-tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows Binary
        shell: pwsh
        env:
          IS_TEST_BUILD: ${{ needs.validate-tag.outputs.is_test_build }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          try {
            $hasValidKey = $false
            if (-not [string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
              if ($env:TAURI_SIGNING_PRIVATE_KEY -match "untrusted comment:") {
                $hasValidKey = $true
              }
            }
            if ($env:IS_TEST_BUILD -eq "true") {
              Write-Host "Test build mode: Disabling updater artifacts and pubkey for unsigned test build."
              Remove-Item Env:\TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
              Remove-Item Env:\TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
              node -e "fs.writeFileSync('tauri.build-override.json', JSON.stringify({ bundle: { createUpdaterArtifacts: false }, plugins: { updater: { pubkey: null } } }));"
            } elseif ($hasValidKey) {
              Write-Host "Valid Tauri updater signing private key detected. Enabling updater artifacts generation."
              node -e "fs.writeFileSync('tauri.build-override.json', JSON.stringify({ bundle: { createUpdaterArtifacts: true } }));"
            } else {
              Write-Error "Official release requires TAURI_SIGNING_PRIVATE_KEY for Windows updater artifacts!"
              exit 1
            }
            npx tauri build -c tauri.build-override.json
          } finally {
            Remove-Item -Force tauri.build-override.json -ErrorAction SilentlyContinue
          }

      - name: Stage and Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist_release -Force | Out-Null
          $tag = "${{ needs.validate-tag.outputs.tag }}"
          
          # Copy NSIS setup installer as Curry_vX.Y_win-x64-setup.exe
          $nsisExe = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "dist_release\Curry_${tag}_win-x64-setup.exe"
          }
          
          # Stage standalone Curry.exe directly into dist_release
          Copy-Item "src-tauri\target\release\curry.exe" "dist_release\Curry.exe"

          # Zip packaging containing installer and standalone binary
          $stage = "dist_release\staging"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "src-tauri\target\release\curry.exe" "$stage\Curry.exe"
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "$stage\Curry_${tag}_win-x64-setup.exe"
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "dist_release\Curry_${tag}_win-x64.zip" -Force
          Remove-Item -Recurse -Force $stage

          # Stage updater artifacts if created (.nsis.zip, .zip, and .sig)
          $updaterFiles = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Include "*.nsis.zip","*.nsis.zip.sig","*.zip.sig" -Recurse
          if ($updaterFiles) {
            $updaterFiles | Copy-Item -Destination "dist_release\" -Force
          }
          if (Test-Path "src-tauri\target\release\bundle\updater\*") {
            Copy-Item "src-tauri\target\release\bundle\updater\*" "dist_release\" -Recurse -Force
          }

      - name: Upload Windows Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-artifacts
          path: dist_release/*

  publish-release:
    name: Publish Draft Release
    runs-on: ubuntu-latest
    needs: [validate-tag, release-mac, release-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}

      - name: Install Minisign Verification Tool
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged_artifacts

      - name: Consolidate and verify release assets
        run: |
          rm -rf dist_release
          mkdir -p dist_release
          TAG="${{ needs.validate-tag.outputs.tag }}"
          IS_TEST="${{ needs.validate-tag.outputs.is_test_build }}"

          if [ -d "staged_artifacts/macos-arm64-artifacts" ]; then
            cp -r staged_artifacts/macos-arm64-artifacts/* dist_release/
          fi
          if [ -d "staged_artifacts/windows-x64-artifacts" ]; then
            cp -r staged_artifacts/windows-x64-artifacts/* dist_release/
          fi

          # Extract public key from tauri.conf.json for cryptographic verification
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const b64 = conf?.plugins?.updater?.pubkey;
            if (!b64) {
              console.error('::error::Missing plugins.updater.pubkey in src-tauri/tauri.conf.json!');
              process.exit(1);
            }
            fs.writeFileSync('dist_release/curry_updater.pub', Buffer.from(b64, 'base64').toString('utf8'));
          "

          # Cryptographic Minisign verification of updater archives against signatures
          if [ "$IS_TEST" != "true" ]; then
            echo "=== Cryptographic Minisign Verification ==="
            MAC_ARCHIVE=$(find dist_release -maxdepth 1 -name "*.tar.gz" ! -name "*.sig" | head -n 1)
            MAC_SIG=$(find dist_release -maxdepth 1 -name "*.tar.gz.sig" | head -n 1)
            WIN_ARCHIVE=$(find dist_release -maxdepth 1 -name "*.nsis.zip" ! -name "*.sig" | head -n 1)
            WIN_SIG=$(find dist_release -maxdepth 1 -name "*.nsis.zip.sig" | head -n 1)

            if [ -z "$MAC_ARCHIVE" ] || [ -z "$MAC_SIG" ]; then
              echo "::error::Official release requires macOS updater archive and signature file!"
              exit 1
            fi
            if [ -z "$WIN_ARCHIVE" ] || [ -z "$WIN_SIG" ]; then
              echo "::error::Official release requires Windows updater archive and signature file!"
              exit 1
            fi

            echo "Verifying macOS updater archive with Minisign ($MAC_ARCHIVE)..."
            minisign -Vm "$MAC_ARCHIVE" -x "$MAC_SIG" -p dist_release/curry_updater.pub
            echo "macOS updater archive cryptographically verified against public key."

            echo "Verifying Windows updater archive with Minisign ($WIN_ARCHIVE)..."
            minisign -Vm "$WIN_ARCHIVE" -x "$WIN_SIG" -p dist_release/curry_updater.pub
            echo "Windows updater archive cryptographically verified against public key."
          else
            echo "Notice: Test build mode (allow_unsigned=true). Cryptographic signature verification bypassed."
          fi

          # Clean up temporary public key before hashing
          rm -f dist_release/curry_updater.pub

          # Safely generate multi-platform latest.json updater manifest from verified updater artifacts
          node -e "
            const fs = require('fs');
            const path = require('path');

            const isTest = '${{ needs.validate-tag.outputs.is_test_build }}' === 'true';
            const tag = '${{ needs.validate-tag.outputs.tag }}';
            const releaseTag = '${{ needs.validate-tag.outputs.release_tag }}';
            const expectedTech = require('./package.json').version;

            console.log('Building latest.json updater manifest for version:', expectedTech);

            const files = fs.readdirSync('dist_release');
            const macArchive = files.find(f => f.endsWith('.tar.gz') && !f.endsWith('.sig'));
            const macSigFile = macArchive ? files.find(f => f === macArchive + '.sig' || (f.endsWith('.tar.gz.sig') && f.startsWith(macArchive.replace('.tar.gz', '')))) : null;

            const winArchive = files.find(f => (f.endsWith('.nsis.zip') || (f.endsWith('.zip') && f.includes('setup'))) && !f.endsWith('.sig'));
            const winSigFile = winArchive ? files.find(f => f === winArchive + '.sig' || f.endsWith('.nsis.zip.sig')) : null;

            let macSig = '';
            let winSig = '';

            if (macSigFile && fs.existsSync(path.join('dist_release', macSigFile))) {
              macSig = fs.readFileSync(path.join('dist_release', macSigFile), 'utf8').trim();
            }
            if (winSigFile && fs.existsSync(path.join('dist_release', winSigFile))) {
              winSig = fs.readFileSync(path.join('dist_release', winSigFile), 'utf8').trim();
            }

            console.log('macOS updater archive:', macArchive, 'sig file:', macSigFile);
            console.log('Windows updater archive:', winArchive, 'sig file:', winSigFile);

            if (!isTest) {
              if (!macArchive || !macSig) {
                console.error('::error::Official release requires signed macOS updater archive (.tar.gz and .sig)!');
                process.exit(1);
              }
              if (!winArchive || !winSig) {
                console.error('::error::Official release requires signed Windows updater archive (.nsis.zip and .sig)!');
                process.exit(1);
              }
            }

            if (macArchive && winArchive && macSig && winSig) {
              const manifest = {
                version: expectedTech,
                notes: 'Curry ' + tag + ' release',
                pub_date: new Date().toISOString(),
                platforms: {
                  'darwin-aarch64': {
                    signature: macSig,
                    url: 'https://github.com/owergungor/Curry/releases/download/' + releaseTag + '/' + macArchive
                  },
                  'windows-x86_64': {
                    signature: winSig,
                    url: 'https://github.com/owergungor/Curry/releases/download/' + releaseTag + '/' + winArchive
                  }
                }
              };
              fs.writeFileSync('dist_release/latest.json', JSON.stringify(manifest, null, 2));
              console.log('Generated unified multi-platform latest.json:');
              console.log(JSON.stringify(manifest, null, 2));
            } else if (isTest) {
              console.log('Notice: Test build without complete signatures. Skipping latest.json generation.');
            } else {
              console.error('::error::Failed to generate latest.json updater manifest for official release!');
              process.exit(1);
            }
          "

          echo "=== Staged Release Assets for $TAG ==="
          ls -lh dist_release/

          REQUIRED_ASSETS=(
            "dist_release/Curry_${TAG}_win-x64-setup.exe"
            "dist_release/Curry_${TAG}_win-x64.zip"
            "dist_release/Curry.exe"
            "dist_release/Curry_${TAG}_mac-arm64.dmg"
            "dist_release/Curry_${TAG}_mac-arm64.app.zip"
          )

          for asset in "${REQUIRED_ASSETS[@]}"; do
            if [ ! -s "$asset" ]; then
              echo "::error::Required release asset '$asset' is missing or zero bytes!"
              exit 1
            fi
          done

          if [ "$IS_TEST" != "true" ]; then
            if [ ! -s "dist_release/latest.json" ]; then
              echo "::error::Official release requires a valid, non-empty 'latest.json' updater manifest!"
              exit 1
            fi
            echo "Verifying latest.json platform signatures..."
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('dist_release/latest.json', 'utf8'));

              // Validate strict Tier 1 platforms: ONLY darwin-aarch64 and windows-x86_64
              const platformKeys = Object.keys(m.platforms || {});
              const allowedKeys = ['darwin-aarch64', 'windows-x86_64'];
              if (platformKeys.length !== 2 || !allowedKeys.every(k => platformKeys.includes(k))) {
                console.error('::error::latest.json must contain exactly darwin-aarch64 and windows-x86_64 platforms! Found:', platformKeys);
                process.exit(1);
              }

              for (const plat of allowedKeys) {
                const p = m.platforms[plat];
                if (!p.signature || !p.signature.startsWith('untrusted comment:')) {
                  console.error('::error::Invalid or empty signature for platform:', plat);
                  process.exit(1);
                }
                if (!p.url || !p.url.startsWith('https://github.com/owergungor/Curry/releases/download/')) {
                  console.error('::error::Invalid download URL for platform:', plat, p.url);
                  process.exit(1);
                }
              }
              console.log('Unified latest.json verified with exact platforms, valid signatures, and correct asset URLs.');
            "
          fi

          cd dist_release
          rm -f SHA256SUMS.txt
          mapfile -t FILES_TO_HASH < <(find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -printf "%f\n" | sort)
          if [ ${#FILES_TO_HASH[@]} -eq 0 ]; then
            echo "::error::No release files found in dist_release to generate SHA256 checksums!"
            exit 1
          fi
          sha256sum "${FILES_TO_HASH[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Create GitHub Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.release_tag }}
          name: ${{ needs.validate-tag.outputs.is_test_build == 'true' && format('Curry {0} (Test Build)', needs.validate-tag.outputs.tag) || format('Curry {0}', needs.validate-tag.outputs.tag) }}
          draft: true
          prerelease: ${{ needs.validate-tag.outputs.is_test_build == 'true' }}
          fail_on_unmatched_files: false
          files: |
            dist_release/Curry_*_win-x64-setup.exe
            dist_release/Curry_*_win-x64.zip
            dist_release/Curry.exe
            dist_release/Curry_*_mac-arm64.dmg
            dist_release/Curry_*_mac-arm64.app.zip
            dist_release/SHA256SUMS.txt
            dist_release/*.tar.gz
            dist_release/*.tar.gz.sig
            dist_release/*.nsis.zip
            dist_release/*.nsis.zip.sig
            dist_release/*.sig
            dist_release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
