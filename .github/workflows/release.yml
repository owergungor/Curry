name: Release Curry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check and Configure Updater Signing
        id: updater-check
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          HAS_VALID_KEY=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | grep -q "untrusted comment:"; then
            HAS_VALID_KEY=true
          fi
          if [ "$HAS_VALID_KEY" = "true" ]; then
            echo "Valid Tauri updater signing key detected. Enabling updater artifacts generation."
            node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); c.bundle.createUpdaterArtifacts=true; fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2));"
            echo "SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "Tauri updater signing key is not provided or not in valid format. Building standard application bundle without updater artifacts."
            echo "SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Build Tauri macOS Apple Silicon App & DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Notice: Apple Developer ID certificate not provided. Building unsigned/ad-hoc package for testing."
            unset APPLE_CERTIFICATE
            unset APPLE_CERTIFICATE_PASSWORD
            unset APPLE_SIGNING_IDENTITY
            unset APPLE_ID
            unset APPLE_PASSWORD
            unset APPLE_TEAM_ID
          fi
          if [ "$SIGNING_ENABLED" != "true" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npx tauri build --target aarch64-apple-darwin

      - name: Stage and Package macOS Artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist_release"
          TAG_NAME="${GITHUB_REF_NAME:-v2.0}"
          if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="v2.0"
          fi
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$TAG_NAME"
          fi
          # Rename and package DMG
          if compgen -G "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg" > /dev/null; then
            cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "$GITHUB_WORKSPACE/dist_release/Curry_${TAG_NAME}_mac-arm64.dmg"
          fi
          # Verify architecture and package .app bundle into zip preserving symlinks (-y is critical for Gatekeeper)
          if [ -d "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Curry.app" ]; then
            cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
            file Curry.app/Contents/MacOS/*
            zip -r -y "$GITHUB_WORKSPACE/dist_release/Curry_${TAG_NAME}_mac-arm64.app.zip" Curry.app
            cd -
          fi
          # Stage updater artifacts if created
          if [ -d "src-tauri/target/aarch64-apple-darwin/release/bundle/updater" ]; then
            cp -r src-tauri/target/aarch64-apple-darwin/release/bundle/updater/* "$GITHUB_WORKSPACE/dist_release/" 2>/dev/null || true
          fi

      - name: Verify Code Signing and Gatekeeper Assessment
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Curry.app"
          if [ -d "$APP_PATH" ]; then
            echo "=== Codesign Verification ==="
            codesign -dv --verbose=4 "$APP_PATH" || true
            echo "=== Deep Codesign Check ==="
            codesign --verify --deep --strict --verbose=2 "$APP_PATH" || echo "Notice: Ad-hoc/unsigned build (no Apple Developer ID signature present)"
            echo "=== Gatekeeper spctl Assessment ==="
            spctl --assess --type execute --verbose=4 "$APP_PATH" || echo "Notice: Notarization ticket not stapled; this build is an unsigned test artifact not accepted by Gatekeeper by default"
          fi

      - name: Notarize and Staple DMG (if Apple credentials provided)
        if: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_FILE=$(compgen -G "$GITHUB_WORKSPACE/dist_release/Curry_*_mac-arm64.dmg" | head -n 1)
          if [ -f "$DMG_FILE" ]; then
            echo "Submitting DMG for Apple notarization..."
            xcrun notarytool submit "$DMG_FILE" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            echo "Stapling notarization ticket..."
            xcrun stapler staple "$DMG_FILE"
          fi

      - name: Upload macOS Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: dist_release/*

      - name: Upload macOS Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0' }}
          name: Curry v2.0
          fail_on_unmatched_files: false
          files: |
            dist_release/Curry_*_mac-arm64.dmg
            dist_release/Curry_*_mac-arm64.app.zip
            dist_release/*.tar.gz
            dist_release/*.sig
            dist_release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows Binary
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $hasValidKey = $false
          if (-not [string]::IsNullOrEmpty($env:TAURI_SIGNING_PRIVATE_KEY)) {
            if ($env:TAURI_SIGNING_PRIVATE_KEY -match "untrusted comment:") {
              $hasValidKey = $true
            }
          }
          if ($hasValidKey) {
            Write-Host "Valid Tauri updater signing private key detected. Enabling updater artifacts generation."
            node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); c.bundle.createUpdaterArtifacts=true; fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2));"
          } else {
            Write-Host "Tauri updater signing key is missing or not in valid format. Building standard installer and binary without updater artifacts."
            Remove-Item Env:\TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:\TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npx tauri build

      - name: Stage and Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist_release -Force | Out-Null
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrEmpty($tag) -or $tag -eq "main") { $tag = "v2.0" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          
          # Copy NSIS setup installer as Curry_vX.Y_win-x64-setup.exe
          $nsisExe = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "dist_release\Curry_${tag}_win-x64-setup.exe"
          }
          
          # Zip packaging containing installer and standalone binary
          $stage = "dist_release\staging"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "src-tauri\target\release\curry.exe" "$stage\Curry.exe"
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName "$stage\Curry_${tag}_win-x64-setup.exe"
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "dist_release\Curry_${tag}_win-x64.zip" -Force
          Remove-Item -Recurse -Force $stage

          # Stage updater artifacts if created
          if (Test-Path "src-tauri\target\release\bundle\updater\*") {
            Copy-Item "src-tauri\target\release\bundle\updater\*" "dist_release\" -Recurse -Force
          }

      - name: Upload Windows Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-artifacts
          path: dist_release/*

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0' }}
          name: Curry v2.0
          fail_on_unmatched_files: false
          files: |
            dist_release/Curry_*_win-x64-setup.exe
            dist_release/Curry_*_win-x64.zip
            dist_release/*.tar.gz
            dist_release/*.sig
            dist_release/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
